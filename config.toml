[camera]
device = 0
width = 1920
height = 1080
settle_frames = 8        # frame dibuang agar autofocus dan eksposur stabil

[quality]
min_sharpness = 50.0     # variansi Laplacian pada grayscale
min_brightness = 55.0    # rata-rata grayscale, skala 0–255
max_retries = 2

[ocr]
lang = "ind+eng"
psm = 6                  # fallback ke 3 dan 11 jika teks sedikit
mode = "camera"          # camera | gray | otsu | adaptive
min_conf = 45            # kata dengan confidence di bawah ini dibuang
tessdata_dir = ""        # biarkan kosong jika menggunakan default sistem

[tts]
model = "models/id_ID-news_tts-medium.onnx"

[audio]
device = "plughw:2,0"    # bcm2835 Headphones (Jack 3.5mm) pada Card 2
mixer = "Headphone"      # mixer kontrol untuk bcm2835 Headphones
volume_steps = [40, 60, 80, 100]

[gpio]
btn_main = 23            # Pin Fisik 16 (Dipindah dari GPIO17 karena Pin 11 dipakai T_IRQ LCD)
btn_aux = 27             # Pin Fisik 13 (Tombol Bantu / Volume & Shutdown)
led = 22                 # Pin Fisik 15 (Gate MOSFET LED Penerangan Dokumen)

[safety]
max_temp_c = 75.0

[gui]
enabled = false          # Ubah ke true jika ingin otomatis membuka layar sentuh TFT
width = 320             # Resolusi LCD RHOS 24 TFT SPI (Landscape)
height = 240
fullscreen = false      # Set true untuk fullscreen di LCD SPI Raspberry Pi
fb_device = "/dev/fb0"  # Target framebuffer LCD (/dev/fb0 atau /dev/fb1)
video_driver = "fbcon"  # Driver video Pygame/SDL (fbcon | dummy)
